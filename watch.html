<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch a location</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
  #top{padding:8px;background:#f6f7f9;display:flex;flex-wrap:wrap;gap:6px}
  select,button{font-size:1rem;padding:9px;border-radius:8px;border:1px solid #c5cad1}
  select{flex:1;min-width:130px}
  button{background:#1b6e4f;color:#fff;border:0}
  #info{padding:6px 10px;font-size:.9rem;background:#e8ebef}
  #map{height:calc(100% - 110px)}
</style>
</head>
<body>
<div id="top">
  <select id="people"><option value="">Choose who to watch...</option></select>
  <select id="routes"><option value="">No route (raw GPS)</option></select>
  <button id="refresh">Refresh</button>
</div>
<div id="info">Pick a person who is sharing. Green marker = smoothed and snapped, grey dot = raw GPS.</div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== PASTE YOUR ANON KEY HERE ======
const SUPABASE_URL = "https://mmeuojvemsvcrvsmmdgm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tZXVvanZlbXN2Y3J2c21tZGdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODU3NzQsImV4cCI6MjEwNjI2MTc3NH0.ri_DyD_NPdLB2Fds1I8T0uOOJjzUF0G0NcfasuJ0p6c";
// ======================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const map = L.map("map").setView([10.85, 76.27], 8);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"&copy; OpenStreetMap contributors"}).addTo(map);

const SNAP_LIMIT = 60;                 // metres: farther than this = "off route", show raw
let marker = null, rawDot = null, routeLine = null, route = null, timer = null;
let target = null, shown = null, firstFix = true, lastIdx = null, lastStamp = null, buf = [], msgBase = "";

// ---------- routes ----------
async function loadRoutes(){
  const { data } = await db.from("routes").select("id,name").order("name");
  if(!data) return;
  const keep = $("routes").value;
  $("routes").innerHTML = '<option value="">No route (raw GPS)</option>' + data.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
  $("routes").value = keep;
}
function prepare(pts){
  const lat0 = pts[0][0], lng0 = pts[0][1], k = Math.cos(lat0 * Math.PI / 180);
  const toXY = (lat, lng) => [(lng - lng0) * 111320 * k, (lat - lat0) * 110540];
  const xy = pts.map(p => toXY(p[0], p[1]));
  const cum = [0];
  for(let i = 1; i < xy.length; i++) cum.push(cum[i-1] + Math.hypot(xy[i][0]-xy[i-1][0], xy[i][1]-xy[i-1][1]));
  return { xy, cum, total: cum[cum.length-1], toXY, lat0, lng0, k };
}
$("routes").onchange = async () => {
  if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
  route = null; lastIdx = null;
  const id = $("routes").value; if(!id) return;
  const { data, error } = await db.from("routes").select("points").eq("id", id).single();
  if(error) return $("info").textContent = "Route load error: " + error.message;
  route = prepare(data.points);
  routeLine = L.polyline(data.points, {color:"#1b6e4f", weight:5, opacity:.5}).addTo(map);
  map.fitBounds(routeLine.getBounds());
  firstFix = false;
};

// ---------- snapping ----------
function search(px, py, lo, hi){
  let best = null;
  for(let i = lo; i <= hi; i++){
    const a = route.xy[i], b = route.xy[i+1];
    const dx = b[0]-a[0], dy = b[1]-a[1], len2 = dx*dx + dy*dy;
    let t = len2 ? ((px-a[0])*dx + (py-a[1])*dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const qx = a[0] + t*dx, qy = a[1] + t*dy, d = Math.hypot(px-qx, py-qy);
    if(!best || d < best.d) best = { d, i, t, qx, qy, len: Math.sqrt(len2) };
  }
  return best;
}
function snap(lat, lng){
  const [px, py] = route.toXY(lat, lng), n = route.xy.length - 1;
  let best = null;
  if(lastIdx !== null) best = search(px, py, Math.max(0, lastIdx - 5), Math.min(n-1, lastIdx + 40)); // near where the bus was
  if(!best || best.d > SNAP_LIMIT) best = search(px, py, 0, n-1);                                 // lost track: look everywhere
  if(best.d > SNAP_LIMIT){ lastIdx = null; return { off: true, d: best.d }; }
  lastIdx = best.i;
  return {
    off: false, d: best.d,
    latlng: [route.lat0 + best.qy / 110540, route.lng0 + best.qx / (111320 * route.k)],
    pct: Math.round((route.cum[best.i] + best.t * best.len) / route.total * 100)
  };
}

// ---------- people + polling ----------
async function loadPeople(){
  const { data, error } = await db.from("locations").select("username").eq("sharing", true).order("username");
  if(error) return $("info").textContent = "Error: " + error.message;
  const keep = $("people").value;
  $("people").innerHTML = '<option value="">Choose who to watch...</option>' + data.map(r => `<option value="${r.username}">${r.username}</option>`).join("");
  $("people").value = keep;
  if(!data.length && !keep) $("info").textContent = "Nobody is sharing right now.";
}
async function poll(){
  const name = $("people").value; if(!name) return;
  const { data, error } = await db.from("locations").select("lat,lng,sharing,updated_at").eq("username", name).maybeSingle();
  if(error || !data) return $("info").textContent = "Could not load " + name;
  if(!data.sharing) return $("info").textContent = name + " stopped sharing.";
  const ago = Math.round((Date.now() - new Date(data.updated_at)) / 1000);
  let text = `${name}: updated ${ago}s ago`;

  if(data.updated_at !== lastStamp){                       // only react to NEW fixes
    lastStamp = data.updated_at;
    buf.push([data.lat, data.lng]); if(buf.length > 3) buf.shift();
    const w = [1, 2, 3].slice(-buf.length), ws = w.reduce((a, b) => a + b, 0);   // newest counts most
    const sm = [0, 1].map(j => buf.reduce((s, p, i) => s + p[j] * w[i], 0) / ws);
    if(!rawDot) rawDot = L.circleMarker([data.lat, data.lng], {radius:5, color:"#666", fillOpacity:.6}).addTo(map);
    rawDot.setLatLng([data.lat, data.lng]);
    msgBase = "";
    if(route){
      const s = snap(sm[0], sm[1]);
      if(s.off){ target = sm; msgBase = ` · OFF ROUTE (${Math.round(s.d)} m away)`; }
      else { target = s.latlng; msgBase = ` · ${s.pct}% along route`; }
    } else target = sm;
  }
  $("info").textContent = text + msgBase;
}
$("people").onchange = () => {
  if(marker){ map.removeLayer(marker); marker = null; }
  if(rawDot){ map.removeLayer(rawDot); rawDot = null; }
  target = shown = lastStamp = lastIdx = null; buf = []; msgBase = ""; firstFix = !route;
  clearInterval(timer);
  if($("people").value){ poll(); timer = setInterval(poll, 3000); }
};

// ---------- smooth animation: glide toward the target instead of jumping ----------
function tick(){
  if(target){
    if(!shown) shown = target.slice();
    shown[0] += (target[0] - shown[0]) * 0.06;
    shown[1] += (target[1] - shown[1]) * 0.06;
    if(!marker) marker = L.marker(shown).addTo(map); else marker.setLatLng(shown);
    if(firstFix){ map.setView(shown, 16); firstFix = false; }
  }
  requestAnimationFrame(tick);
}
tick();

$("refresh").onclick = () => { loadPeople(); loadRoutes(); };
loadPeople(); loadRoutes();
setInterval(loadPeople, 15000);
</script>
</body>
</html>
